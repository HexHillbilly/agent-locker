[project]
name = "lockermcp"
version = "0.1.0"
description = "lockermcp (MCP server) + lockerd (daemon): tamper-evident, append-only agent-to-agent task handoff"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    { name = "HexHillbilly" },
]
keywords = ["mcp", "agents", "handoff", "tamper-evident", "hash-chain", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "mcp>=2.0,<3",
]

[project.urls]
Homepage = "https://padlockspace.org"
Repository = "https://github.com/HexHillbilly/agent-locker"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
lockerd = "lockerd.__main__:main"
lockermcp = "lockermcp.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lockerd*", "lockermcp*"]
