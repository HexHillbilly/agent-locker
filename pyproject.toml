[project]
name = "agent-locker"
version = "0.1.0"
description = "Tamper-evident append-only locker daemon for agent-to-agent task handoff"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "aiosqlite>=0.20",
    "uvicorn[standard]>=0.29",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
lockerd = "lockerd.__main__:main"
lockermcp = "lockermcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lockerd", "lockermcp"]
